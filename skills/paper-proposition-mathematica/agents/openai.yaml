interface:
  display_name: "Paper Proposition Mathematica"
  short_description: "Style-exemplar WL derivations"
  default_prompt: "Use $paper-proposition-mathematica to reproduce or audit an economics proposition from its original model and timing. Inspect the user's WL style exemplar, or the bundled conditional-stationary-point example when none is provided. Derive step by step, retain all candidate solutions and justify any selection, state domains and the requested proof scope, preserve raw mathematical evidence, and assemble named results, appropriate summary tables, and executable checks without treating their success as a full equilibrium proof."
